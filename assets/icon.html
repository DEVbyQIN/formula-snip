<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #icon {
    width: 1024px; height: 1024px;
    border-radius: 224px;
    background: linear-gradient(150deg, #6366f1 0%, #5b21b6 46%, #7c3aed 100%);
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.22), inset 0 -8px 30px rgba(0,0,0,0.18);
  }
  #icon::before {
    content: "";
    position: absolute;
    inset: -20% -10% auto -20%;
    height: 70%;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.32), rgba(255,255,255,0) 62%);
  }
  #icon::after {
    content: "";
    position: absolute;
    inset: auto -30% -35% auto;
    width: 80%; height: 80%;
    background: radial-gradient(circle at 70% 80%, rgba(217,70,239,0.55), rgba(217,70,239,0) 60%);
  }
  .glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Times New Roman", "STIX Two Math", serif;
    font-size: 620px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 10px 30px rgba(30, 15, 90, 0.45);
    transform: translateY(-8px);
  }
  .dot {
    position: absolute;
    right: 238px;
    top: 220px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
  <div id="icon">
    <div class="glyph">&#8747;</div>
  </div>
</body>
</html>
