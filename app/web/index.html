<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormulaSnip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo">∫</div>
      <div class="brand-text">
        <h1>FormulaSnip</h1>
        <p>LaTeX snippet → 透明 PNG</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="save-state" id="saveState"></span>
      <button id="copyBtn" class="btn ghost" title="复制 PNG 到剪贴板（⌘⇧C）">复制图片</button>
      <button id="exportBtn" class="btn primary" title="导出透明 PNG（⌘E）">导出 PNG</button>
    </div>
  </header>

  <main id="main">
    <section class="pane" id="editorPane">
      <div class="pane-head">
        <span>LaTeX 输入</span>
        <span class="pane-hint" id="modeHint">独立公式</span>
      </div>
      <div class="editor-wrap">
        <textarea id="tex" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="soft" placeholder="输入 LaTeX，支持 LaTeX-suite 风格 snippet：&#10;  //      分式&#10;  @a      α&#10;  sr      平方&#10;  xhat    x̂&#10;  pmat    矩阵&#10;输完后按空格展开。"></textarea>
        <div class="editor-ghost" id="ghost"></div>
      </div>
      <div class="hint-line">
        <span id="snippetHint" class="snippet-hint"></span>
      </div>
      <div class="controls">
        <label class="ctl">
          <span class="ctl-label">字体</span>
          <select id="fontSelect" class="select"></select>
        </label>
        <div class="ctl color-ctl">
          <span class="ctl-label">颜色</span>
          <div class="color-row">
            <div id="swatches" class="swatches"></div>
            <input type="color" id="colorPicker" value="#111827" title="自定义颜色">
            <input id="colorHex" class="hex" maxlength="7" spellcheck="false" value="#111827">
          </div>
        </div>
        <label class="ctl">
          <span class="ctl-label">字号 <b id="sizeVal">32</b> px</span>
          <input type="range" id="sizeRange" min="14" max="96" step="1" value="32">
        </label>
        <div class="ctl">
          <span class="ctl-label">模式</span>
          <div class="seg" id="modeSeg">
            <button data-mode="display" class="on">独立</button>
            <button data-mode="inline">行内</button>
          </div>
        </div>
        <label class="ctl">
          <span class="ctl-label">导出倍率</span>
          <select id="scaleSelect" class="select">
            <option value="1">1×</option>
            <option value="2" selected>2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <div class="ctl">
          <span class="ctl-label">预览背景</span>
          <div class="seg" id="bgSeg">
            <button data-bg="checker" class="on">棋盘</button>
            <button data-bg="white">白</button>
            <button data-bg="black">黑</button>
          </div>
        </div>
      </div>
    </section>

    <section class="pane" id="previewPane">
      <div class="pane-head">
        <span>预览 <span class="transparent-tag">透明背景</span></span>
        <span class="dims" id="dims"></span>
      </div>
      <div class="stage" id="stage">
        <div class="stage-inner" id="previewInner">
          <div id="preview"></div>
        </div>
      </div>
      <div class="status" id="status">就绪</div>
    </section>
  </main>

  <section id="bottom">
    <div class="tabs" id="tabs">
      <button data-tab="history" class="on">历史 <span class="count" id="historyCount">0</span></button>
      <button data-tab="logs">日志</button>
      <button data-tab="snippets">snippets</button>
      <span class="tabs-spacer"></span>
      <button id="panelAction" class="tab-action" hidden></button>
    </div>
    <div class="tab-body" id="tabBody"></div>
  </section>
</div>

<div id="rendererHost"></div>
<script src="snippets.js"></script>
<script src="app.js"></script>
</body>
</html>
